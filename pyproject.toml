[project]
name = "arcade-score-oracle"
version = "0.1.0"
description = "GenLayer Intelligent Contract primitive for AI-verified arcade score oracle"
dependencies = [
    "py-genlayer>=0.1.0",
    "pytest>=7.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
